name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity, which would
# stop sign-in and saving. A tiny read every 3 days keeps it running.
# (GitHub turns off scheduled workflows in repos with no commits for 60
# days; re-enable it from the Actions tab if that ever happens.)
on:
  schedule:
    - cron: '23 3 */3 * *' # every 3 days, 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the public API
        env:
          # same public values the site uses (Row Level Security applies)
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pheawjaqtsifkmlsjhea.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_2h_vEGHjbvnC0kxSlUj7BA_C1WjxQCU' }}
        run: |
          set -eu
          base="${SUPABASE_URL%/}"
          base="${base%/rest/v1}"
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$base/rest/v1/days?select=date&limit=1" \
              -H "apikey: $SUPABASE_KEY" || echo 000)
            echo "attempt $attempt → HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not answer with 200. If the project was paused, restore it in the Supabase dashboard."
          exit 1
