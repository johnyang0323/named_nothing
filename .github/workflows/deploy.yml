name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Kakao Maps *JavaScript* key. It is public by design (it ships inside
          # the built page) and is protected by the domains registered in Kakao
          # Developers. A repository variable KAKAO_MAP_KEY overrides it.
          # Never put a REST API or Admin key here.
          VITE_KAKAO_MAP_KEY: ${{ vars.KAKAO_MAP_KEY || '620acc4efbe83de826d11c5d0efe947d' }}
          # Supabase project URL and anon (public) key, for accounts and photos.
          # Also public by design; Row Level Security protects the data.
          # Set them as repository Variables SUPABASE_URL / SUPABASE_ANON_KEY.
          # Never use the service_role key here.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
