name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # Browser tests against stand-ins for Kakao, Supabase and Open-Meteo.
      # A failure stops the deploy, so a broken build never goes live.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep screenshots from failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/.output/shots
          retention-days: 7
      - run: npm run build
        env:
          # Kakao Maps *JavaScript* key. It is public by design (it ships inside
          # the built page) and is protected by the domains registered in Kakao
          # Developers. A repository variable KAKAO_MAP_KEY overrides it.
          # Never put a REST API or Admin key here.
          VITE_KAKAO_MAP_KEY: ${{ vars.KAKAO_MAP_KEY || '620acc4efbe83de826d11c5d0efe947d' }}
          VITE_GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_KEY || '' }}
          # Supabase project URL and anon (public) key, for accounts and photos.
          # Also public by design; Row Level Security protects the data.
          # Repository Variables SUPABASE_URL / SUPABASE_ANON_KEY override these.
          # Never use the service_role key here.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pheawjaqtsifkmlsjhea.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_2h_vEGHjbvnC0kxSlUj7BA_C1WjxQCU' }}
          # URL name of the photo Edge Function (the last part of its URL on the
          # function's Overview page). The app also tries place-photo and
          # hyper-responder if this name isn't found.
          VITE_PHOTO_FUNCTION: ${{ vars.PHOTO_FUNCTION || 'place-photo' }}
          # URL name of the account-deletion Edge Function.
          VITE_DELETE_FUNCTION: ${{ vars.DELETE_FUNCTION || 'delete-account' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
