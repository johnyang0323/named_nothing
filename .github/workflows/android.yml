name: Android test app

# Builds an installable test APK of the app (Capacitor) and publishes it on
# the "android-preview" release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app
        run: npm run build
        env:
          # Same public values as the website build (see deploy.yml).
          VITE_KAKAO_MAP_KEY: ${{ vars.KAKAO_MAP_KEY || '620acc4efbe83de826d11c5d0efe947d' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pheawjaqtsifkmlsjhea.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_2h_vEGHjbvnC0kxSlUj7BA_C1WjxQCU' }}
          VITE_PHOTO_FUNCTION: ${{ vars.PHOTO_FUNCTION || 'hyper-responder' }}
          VITE_DELETE_FUNCTION: ${{ vars.DELETE_FUNCTION || 'delete-account' }}
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../haru-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: haru-test-apk
          path: haru-test.apk
          retention-days: 14
      - name: Publish on the android-preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-preview --yes --cleanup-tag || true
          gh release create android-preview haru-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "안드로이드 테스트 앱" \
            --notes "휴대폰에서 haru-test.apk 를 눌러 받은 뒤 설치하세요. 테스트용(디버그) 빌드예요. 커밋 ${GITHUB_SHA::7}"
